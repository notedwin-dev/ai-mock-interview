services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aimis}
      POSTGRES_DB: ${POSTGRES_DB:-aimis}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Publishes the container's Postgres to the host so `pnpm dev` outside
      # Docker can reach it via the DATABASE_URL in .env. Drop in production.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimis} -d ${POSTGRES_DB:-aimis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aimis}:${POSTGRES_PASSWORD:-aimis}@db:5432/${POSTGRES_DB:-aimis}?schema=public
    volumes:
      - recordings:/app/storage/recordings
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Enable once certificates are provisioned (IR 2.4.8 requires HTTPS).
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  db-data:
  recordings:
